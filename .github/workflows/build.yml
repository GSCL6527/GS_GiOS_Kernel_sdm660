name: Build Kernel Wayne with ReSukiSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install build dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential ccache curl flex \
        libelf-dev liblz4-tool libssl-dev lzop zip cpio python3 device-tree-compiler

    - name: Maximize build space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
        sudo swapoff /swapfile 2>/dev/null || true
        sudo rm -f /swapfile
        sudo fallocate -l 4G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    - name: Download Proton Clang
      run: git clone https://github.com/kdrag0n/proton-clang.git --depth=1 $GITHUB_WORKSPACE/clang

    - name: Setup ReSukiSU (KernelSU module)
      run: |
        rm -rf KernelSU drivers/kernelsu
        git clone https://github.com/ReSukiSU/ReSukiSU.git KernelSU
        # NOTE: do NOT pin an old commit: the fs/exec.c hooks in this kernel
        # call ksu_handle_post_execveat_sucompat(), which only exists in
        # recent ReSukiSU (guarded by CONFIG_KSU_SUSFS). This kernel tree
        # ships SUSFS (fs/susfs.c), so SUSFS mode is required.
        cd KernelSU
        git log -1 --format="ReSukiSU HEAD: %H %ci"
        cd ..
        ln -sf $(pwd)/KernelSU/kernel $(pwd)/drivers/kernelsu
        # drivers/Kconfig and drivers/Makefile already source kernelsu via obj-$(CONFIG_KSU)

    - name: Enable KernelSU in defconfig
      run: |
        DEFCONFIG=arch/arm64/configs/vendor/wayne-oss-perf_defconfig
        if grep -q "^# CONFIG_KSU is not set" $DEFCONFIG; then
          sed -i 's/^# CONFIG_KSU is not set$/CONFIG_KSU=y/' $DEFCONFIG
        elif ! grep -q "^CONFIG_KSU=y" $DEFCONFIG; then
          echo "CONFIG_KSU=y" >> $DEFCONFIG
        fi
        # Kernel tree has SUSFS (fs/susfs.c); fs hooks expect SUSFS mode.
        if grep -q "^# CONFIG_KSU_SUSFS is not set" $DEFCONFIG; then
          sed -i 's/^# CONFIG_KSU_SUSFS is not set$/CONFIG_KSU_SUSFS=y/' $DEFCONFIG
        elif ! grep -q "^CONFIG_KSU_SUSFS=y" $DEFCONFIG; then
          echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG
        fi
        # Disable git-hash version suffix: with LOCALVERSION_AUTO=y the full
        # release string exceeds the 64-char limit and the build aborts.
        sed -i 's/^CONFIG_LOCALVERSION_AUTO=y$/# CONFIG_LOCALVERSION_AUTO is not set/' $DEFCONFIG
        # Exact release string: 4.19.325-GSKernel-ReSukiSU-perf
        # (localversion* files in tree root would append -cip132-st16, so empty them)
        sed -i 's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-GSKernel-ReSukiSU-perf"/' $DEFCONFIG
        for f in localversion*; do [ -f "$f" ] && : > "$f"; done
        grep -n "KSU\|LOCALVERSION" $DEFCONFIG

        # clang cannot resolve TRACE_INCLUDE_PATH '.' in clk-debug trace
        # points; add the source dir to the include path (standard fix).
        grep -q "CFLAGS_clk-debug" drivers/clk/qcom/Makefile || \
          echo 'CFLAGS_clk-debug.o = -I$(src)' >> drivers/clk/qcom/Makefile
        # camera_v2-oss: ccflags-y from parent Makefiles are not inherited by
        # subdir objects, and clang (unlike gcc) does not search include-stack
        # dirs for quoted includes. Add every dir under the camera tree as a
        # subdir-ccflags-y include (verified: no duplicate header names).
        CAM_BASE=drivers/media/platform/msm/camera_v2-oss
        CAM_MK=$CAM_BASE/Makefile
        if ! grep -q "subdir-ccflags-y" $CAM_MK; then
          find $CAM_BASE -type d | while read -r d; do
            printf 'subdir-ccflags-y += -I$(srctree)/%s\n' "$d" >> $CAM_MK
          done
        fi

        # ipa_v2/ipa_trace.h uses TRACE_INCLUDE_PATH '.' which clang cannot
        # resolve; add the dir to the include path for all ipa_v2 objects.
        IPA_MK=drivers/platform/msm/ipa/ipa_v2/Makefile
        grep -q "subdir-ccflags-y" $IPA_MK || \
          echo 'subdir-ccflags-y += -I$(srctree)/drivers/platform/msm/ipa/ipa_v2' >> $IPA_MK

    - name: Build Kernel
      run: |
        export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64

        MAKE_ARGS="CC=clang \
                   LD=ld.lld \
                   AR=llvm-ar \
                   NM=llvm-nm \
                   OBJCOPY=llvm-objcopy \
                   OBJDUMP=llvm-objdump \
                   STRIP=llvm-strip \
                   CROSS_COMPILE=aarch64-linux-android- \
                   CROSS_COMPILE_ARM32=arm-linux-androideabi- \
                   CLANG_TRIPLE=aarch64-linux-gnu- \
                   KCFLAGS=-Wno-error"

        make mrproper
        make vendor/wayne-oss-perf_defconfig $MAKE_ARGS
        if ! grep -q "^CONFIG_KSU=y" .config; then
          echo "::error::CONFIG_KSU was not enabled in final .config"
          grep -i ksu .config || true
          exit 1
        fi
        echo "CONFIG_KSU=y confirmed in .config"
        make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb
        ls -lh arch/arm64/boot/Image.gz-dtb
        # Verify exact release string baked into the binary
        VER=$(gzip -dc arch/arm64/boot/Image.gz-dtb 2>/dev/null | strings | grep -m1 -o "4\.19\.325-GSKernel-ReSukiSU-perf" || true)
        echo "kernel release in binary: $VER"
        [ "$VER" = "4.19.325-GSKernel-ReSukiSU-perf" ] || { echo "::error::version string mismatch"; exit 1; }

    - name: Package with AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
        cp arch/arm64/boot/Image.gz-dtb AnyKernel3/
        cd AnyKernel3
        rm -rf .git .github *placeholder
        cat > anykernel.sh << 'EOF'
        ### AnyKernel setup
        properties() { '
        kernel.string=4.19.325-GSKernel-ReSukiSU-perf
        do.devicecheck=1
        do.modules=0
        do.systemless=1
        do.cleanup=1
        do.cleanuponabort=0
        device.name1=wayne
        device.name2=wayne_eea
        device.name3=tissot
        supported.versions=
        supported.patchlevels=
        supported.vendorpatchlevels=
        '; } # end properties

        ### AnyKernel install
        ## boot files attributes
        boot_attributes() {
        set_perm_recursive 0 0 755 644 $RAMDISK/*;
        set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
        } # end attributes

        # boot shell variables
        BLOCK=/dev/block/bootdevice/by-name/boot;
        IS_SLOT_DEVICE=0;
        RAMDISK_COMPRESSION=auto;
        PATCH_VBMETA_FLAG=auto;

        # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
        . tools/ak3-core.sh;

        # boot install
        dump_boot; # unpack current boot image
        write_boot; # repack it with our Image.gz-dtb and flash to boot partition
        EOF
        # Sanity check: the AK3 backend only runs `ash anykernel.sh`, so the
        # script MUST source ak3-core.sh and call dump_boot/write_boot,
        # otherwise the install "succeeds" without writing anything to boot.
        grep -q "dump_boot" anykernel.sh && grep -q "write_boot" anykernel.sh || {
          echo "::error::anykernel.sh missing dump_boot/write_boot"; exit 1; }
        zip -r9 ../GS-Kernel-Wayne-4.19.325-GSKernel-ReSukiSU-perf.zip *
        cd ..

    - name: Upload flashable zip
      uses: actions/upload-artifact@v4
      with:
        name: GS-Kernel-Wayne-AnyKernel3
        path: GS-Kernel-Wayne-*.zip

    - name: Upload raw Image.gz-dtb
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz-dtb
        path: arch/arm64/boot/Image.gz-dtb
